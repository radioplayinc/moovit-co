<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF6">
<title>Move Co. — Book movers in minutes (template)</title>
<!--
  ============================================================================
  MOVE CO. — booking template (v0.1)
  ----------------------------------------------------------------------------
  BRANDING SLOTS (swap when the client brand lands):
    1. --brand / --brand-ink   CSS variables below (accent color)
    2. <!--BRAND:LOGO-->       header + loader logo mark (inline SVG now)
    3. CONFIG.brand            JS object near the top of the <script>
    4. CONFIG.payments         Stripe test stub — wire publishable key + PaymentIntent here
  No external assets, no network calls. Works offline from a file or a link.
  ============================================================================
-->
<style>
  :root{
    --brand:#FF4D00;            /* BRAND: primary accent — swap for client color */
    --brand-ink:#ffffff;
    --brand-soft:#FFE9DC;
    --ink:#141412;
    --muted:#6f6e68;
    --faint:#a9a8a1;
    --paper:#FAFAF6;
    --card:#ffffff;
    --line:#e7e4dc;
    --danger:#d33a2c;
    --radius:18px;
    --shadow:0 14px 34px rgba(20,20,18,.09);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input{font:inherit;color:inherit}

  #app{position:fixed;inset:0;overflow:hidden;background:
    radial-gradient(120% 60% at 50% -10%, #fff 0%, var(--paper) 55%)}

  /* ---------- chrome (header + progress) ---------- */
  #chrome{position:absolute;top:0;left:0;right:0;z-index:50;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 0;
    opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
  #chrome.on{opacity:1;visibility:visible;transition:opacity .35s ease}
  #chrome-row{display:flex;align-items:center;gap:12px;min-height:40px}
  #back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    border:1px solid var(--line);background:var(--card);flex:none;
    opacity:0;pointer-events:none;transform:translateX(-6px);transition:opacity .3s,transform .3s var(--ease)}
  #back.show{opacity:1;pointer-events:auto;transform:none}
  #back svg{width:18px;height:18px}
  #wordmark{display:flex;align-items:center;gap:9px;margin:0 auto}
  #wordmark svg{width:26px;height:26px}
  #wordmark b{font-size:14px;letter-spacing:.14em;font-weight:800}
  #stepcount{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
  #ptrack{height:3px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
  /* GlidingIndicator: one marker, glides (never teleports) between positions */
  #pfill{height:100%;width:100%;background:var(--brand);border-radius:99px;
    transform:scaleX(0);transform-origin:left center;
    transition:transform .65s var(--ease)}

  /* ---------- screens: one full page at a time, never scroll ---------- */
  #stage{position:absolute;inset:0}
  .screen{position:absolute;inset:0;overflow:hidden;display:flex;
    opacity:0;visibility:hidden;transform:translateX(56px);
    transition:opacity .32s ease,transform .52s var(--ease),visibility 0s .55s}
  .screen.active{opacity:1;visibility:visible;transform:none;
    transition:opacity .32s ease,transform .52s var(--ease),visibility 0s 0s}
  .screen.from-left{transform:translateX(-56px)}
  .screen-inner{width:min(540px,100%);height:100%;margin:0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 92px) 24px calc(env(safe-area-inset-bottom,0px) + 30px);
    display:flex;flex-direction:column;justify-content:center;gap:14px}
  .screen.compact .screen-inner{gap:10px}

  .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.22em;color:var(--brand);text-transform:uppercase}
  h1{font-size:clamp(1.85rem,6.4vw,2.55rem);line-height:1.06;letter-spacing:-.025em;font-weight:750}
  .screen.compact h1{font-size:clamp(1.5rem,5.4vw,2rem)}
  .lede{color:var(--muted);font-size:clamp(.98rem,3.9vw,1.08rem);line-height:1.5;max-width:34ch}
  .lede b{color:var(--ink)}

  /* SplitTextCascadeReveal: word-level cascade, fade + short rise, staggered */
  .cascade .w{display:inline-block;opacity:0;transform:translateY(.42em);
    transition:opacity .38s ease,transform .58s var(--ease)}
  .cascade.in .w{opacity:1;transform:none}

  /* ---------- option cards / yes-no ---------- */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .opts.one{grid-template-columns:1fr}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:118px;
    transition:border-color .25s,box-shadow .25s,transform .18s ease;position:relative;overflow:hidden}
  .opt:hover{border-color:var(--ink)}
  .opt.sel{border-color:var(--brand);box-shadow:0 0 0 1.5px var(--brand),var(--shadow)}
  .opt .ic{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);
    display:grid;place-items:center;color:var(--brand);flex:none}
  .opt .ic svg{width:19px;height:19px}
  .opt b{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
  .opt small{color:var(--muted);font-size:.85rem;line-height:1.4}
  .opt .tick{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:99px;
    background:var(--brand);color:#fff;display:grid;place-items:center;
    opacity:0;transform:scale(.5);transition:opacity .25s,transform .3s var(--ease)}
  .opt.sel .tick{opacity:1;transform:none}
  .opt .tick svg{width:12px;height:12px}

  .ynrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .yn{border:1.5px solid var(--line);background:var(--card);border-radius:var(--radius);
    min-height:76px;font-size:1.15rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;
    transition:border-color .25s,background .25s,color .25s}
  .yn small{font-weight:500;color:var(--muted);font-size:.85rem}
  .yn.yes.sel{background:var(--ink);border-color:var(--ink);color:#fff}
  .yn.yes.sel small{color:#c9c8c2}
  .yn.no.sel{background:#fff;border-color:var(--ink)}

  /* ---------- inputs ---------- */
  .field{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .field label{font-size:.86rem;font-weight:650;color:var(--muted)}
  .field input,.field select{background:var(--card);border:1.5px solid var(--line);
    border-radius:14px;min-height:58px;padding:0 18px;font-size:17px;width:100%;outline:none;
    transition:border-color .2s,box-shadow .2s}
  .field input:focus,.field select:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,20,18,.07)}
  .field input.bad{border-color:var(--danger);box-shadow:0 0 0 3px rgba(211,58,44,.12)}
  .hint{font-size:.84rem;color:var(--danger);min-height:1.2em}
  .hint.info{color:var(--faint)}
  .inline-cond{overflow:hidden;max-height:0;opacity:0;transform:translateY(-6px);
    transition:max-height .45s var(--ease),opacity .3s,transform .4s var(--ease)}
  .inline-cond.open{max-height:220px;opacity:1;transform:none}

  /* ---------- CTAs ---------- */
  .cta-row{margin-top:10px;display:flex;flex-direction:column;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-height:60px;border-radius:16px;font-size:1.06rem;font-weight:750;letter-spacing:-.01em;
    padding:0 26px;position:relative;will-change:transform;
    transition:background .25s,color .25s,box-shadow .25s,opacity .25s}
  .btn-primary{background:var(--ink);color:#fff;box-shadow:0 10px 26px rgba(20,20,18,.22)}
  .btn-primary:hover{background:#000}
  .btn-brand{background:var(--brand);color:var(--brand-ink);box-shadow:0 10px 26px rgba(255,77,0,.32)}
  .btn-ghost{border:1.5px solid var(--line);background:var(--card);min-height:54px;font-size:.98rem}
  .btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
  .btn svg{width:18px;height:18px}
  .fineprint{text-align:center;font-size:.82rem;color:var(--faint);line-height:1.5}
  .fineprint b{color:var(--muted)}

  /* ---------- loader (ChoreographedLoader) ---------- */
  #loader-mark{width:120px;height:120px;margin:0 auto}
  .loader-wrap{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
  .loader-wrap .l-title{font-size:15px;letter-spacing:.3em;font-weight:800}
  .loader-wrap .l-sub{color:var(--muted);font-size:.92rem}
  #lbar{width:180px;height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 auto}
  #lbar i{display:block;height:100%;width:100%;background:var(--brand);border-radius:99px;
    transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
  /* ChasingSegmentLoop: short segment chasing a closed path, seamless infinite */
  .chase{stroke-dasharray:.24 .76;animation:chase 1.15s linear infinite}
  @keyframes chase{to{stroke-dashoffset:-1}}
  /* PathDrawReveal + DrawThenFill: outline draws 0→1, then fill lands */
  [data-draw]{stroke-dasharray:1;stroke-dashoffset:1}
  .drawn [data-draw]{stroke-dashoffset:0;transition:stroke-dashoffset 1s var(--ease)}
  [data-fill]{opacity:0}
  .drawn [data-fill]{opacity:1;transition:opacity .55s ease .95s}
  #enterBtn{min-width:220px}
  #enterBtn.ready{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(255,77,0,.32)}50%{box-shadow:0 10px 34px rgba(255,77,0,.55)}}

  /* ---------- choice cards (PointerTiltSurface) ---------- */
  .bigcards{display:grid;gap:14px;margin-top:8px}
  @media(min-width:480px){.bigcards{grid-template-columns:1fr 1fr}}
  .bigcard{background:var(--card);border:1.5px solid var(--line);border-radius:22px;
    padding:26px 22px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:210px;
    position:relative;overflow:hidden;will-change:transform;
    transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:border-color .25s,box-shadow .3s}
  .bigcard:hover{border-color:var(--ink);box-shadow:var(--shadow)}
  .bigcard .shine{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.75),transparent 65%)}
  .bigcard:hover .shine{opacity:1}
  .bigcard .ic{width:46px;height:46px;border-radius:14px;background:var(--ink);color:#fff;
    display:grid;place-items:center}
  .bigcard .ic svg{width:24px;height:24px}
  .bigcard.alt .ic{background:var(--brand)}
  .bigcard b{font-size:1.35rem;font-weight:750;letter-spacing:-.02em;line-height:1.15}
  .bigcard p{color:var(--muted);font-size:.94rem;line-height:1.5}
  .bigcard .go{margin-top:auto;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;color:var(--brand)}
  .bigcard .go svg{width:17px;height:17px;transition:transform .3s var(--ease)}
  .bigcard:hover .go svg{transform:translateX(5px)}

  /* ---------- estimate ---------- */
  .est-card{background:var(--ink);color:#fff;border-radius:22px;padding:26px 24px;margin-top:6px;
    box-shadow:0 18px 44px rgba(20,20,18,.25)}
  .est-card .e-label{font-size:.78rem;letter-spacing:.2em;color:#b9b8b2;font-weight:700}
  #estTotal{font-size:clamp(2.6rem,11vw,3.4rem);font-weight:800;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;margin:6px 0 4px}
  .est-card .e-note{font-size:.85rem;color:#b9b8b2;line-height:1.5}
  .est-lines{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
  .est-line{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;font-size:.94rem;
    border-bottom:1px dashed var(--line)}
  .est-line span:first-child{color:var(--muted)}
  .est-line span:last-child{font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- review / jobs / success ---------- */
  .review{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-top:6px}
  .review .r-row{display:flex;justify-content:space-between;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:.93rem}
  .review .r-row:last-child{border-bottom:none}
  .review .r-row span:first-child{color:var(--muted)}
  .review .r-row span:last-child{font-weight:650;text-align:right}
  .job{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;display:flex;align-items:center;gap:14px;text-align:left;width:100%}
  .job .j-ic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
  .job .j-ic svg{width:22px;height:22px}
  .job b{display:block;font-size:1rem}
  .job small{color:var(--muted);font-size:.85rem}
  .job .j-pay{margin-left:auto;text-align:right;flex:none}
  .job .j-pay b{color:var(--brand)}
  .job.claimed{border-color:var(--brand);background:#FFF7F2}
  .job .j-claim{font-size:.8rem;font-weight:700;color:var(--brand)}
  #doneMark{width:96px;height:96px;margin:2px auto}
  .done-wrap{text-align:center}
  .refcode{display:inline-block;margin-top:2px;background:var(--card);border:1px dashed var(--faint);
    border-radius:10px;padding:8px 16px;font-weight:800;letter-spacing:.18em;font-size:.95rem}
  .testbanner{background:#FFF4E8;border:1.5px dashed #E8A33D;color:#8a5a12;border-radius:14px;
    padding:12px 16px;font-size:.86rem;line-height:1.5}
  .testbanner b{display:block;font-size:.78rem;letter-spacing:.16em;margin-bottom:2px}
  .card-icons{display:flex;gap:8px;align-items:center;color:var(--faint);font-size:.78rem;font-weight:700;letter-spacing:.08em}

  .shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  /* ---------- CalmStateChoreography: designed reduced-motion state ---------- */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    .screen{transform:none!important}
    .cascade .w{opacity:1;transform:none}
  }
  html.calm .screen{transform:none!important;transition:opacity .22s ease,visibility 0s}
  html.calm .cascade .w{opacity:1!important;transform:none!important;transition:opacity .25s ease}
  html.calm .bigcard{transform:none!important}
  html.calm .chase{animation:none;stroke-dasharray:none}
  html.calm #enterBtn.ready{animation:none}

  /* short screens: tighten everything so one page never overflows */
  @media (max-height:720px){
    .screen-inner{padding-top:calc(env(safe-area-inset-top,0px) + 76px);gap:10px}
    h1{font-size:clamp(1.55rem,5.6vw,2.05rem)}
    .lede{font-size:.94rem}
    #doneMark{width:70px;height:70px}
    #loader-mark{width:96px;height:96px}
    .bigcard{min-height:172px;padding:20px 18px;gap:9px}
    .bigcard b{font-size:1.18rem}
    .opt{min-height:96px;padding:14px}
    .yn{min-height:64px}
    .est-card{padding:20px}
    #estTotal{font-size:2.35rem}
    .btn{min-height:56px}
    .field input,.field select{min-height:52px}
  }
</style>
</head>
<body>
<noscript><p style="padding:40px;font-family:sans-serif">This booking template needs JavaScript enabled.</p></noscript>
<div id="app">
  <header id="chrome" aria-hidden="true">
    <div id="chrome-row">
      <button id="back" aria-label="Go back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <!--BRAND:LOGO — swap this mark + wordmark for the client logo -->
      <div id="wordmark" aria-label="Move Co.">
        <svg viewBox="0 0 32 32" fill="none" stroke="#FF4D00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="10" width="15" height="10" rx="1.5"/><path d="M18 13h5l4 4v3h-9z"/><circle cx="9.5" cy="23" r="2.2"/><circle cx="22.5" cy="23" r="2.2"/>
        </svg>
        <b>MOVE&nbsp;CO.</b>
      </div>
      <div id="stepcount"></div>
    </div>
    <div id="ptrack" role="progressbar" aria-label="Progress"><div id="pfill"></div></div>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>
<script>
"use strict";
/* ==========================================================================
   CONFIG — the only places a template integrator should need to touch
   ========================================================================== */
const CONFIG = {
  brand: { name: "Move Co.", tagline: "Movers, booked in minutes." }, // BRAND: swap name/tagline
  payments: {
    provider: "stripe",          // 'stripe' | 'square' | 'manual'
    mode: "test",                // 'test' -> simulated charge. 'live' requires wiring below.
    publishableKey: "pk_test_REPLACE_ME",
    // LIVE WIRING: create a PaymentIntent on your server, confirm it here with
    // stripe.confirmCardPayment(clientSecret). Never put a secret key in this file.
  },
  contact: { supportPhone: "(555) 010-2030" }, // BRAND: client support number
  supabase: {
    url: "https://zhtfcrrvhqybhtoyppir.supabase.co",
    anonKey: "sb_publishable_1nxmioAIo4sg-Irzuosl7w_xVeXYU-G", // publishable key: safe in front-end code; RLS restricts it to INSERT-only
    enabled: true // set false to run the template fully offline (no network calls)
  }
};

/* ---------- tiny icon set (stroke SVG, currentColor) ---------- */
const I = (p, vb) => `<svg viewBox="${vb||'0 0 24 24'}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  box:   I('<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>'),
  truck: I('<rect x="1.5" y="6" width="13" height="10" rx="1"/><path d="M14.5 10h4l3.5 3.5V16h-7.5z"/><circle cx="6" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/>'),
  home:  I('<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>'),
  apt:   I('<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2M10 21v-3h4v3"/>'),
  office:I('<rect x="3" y="7" width="18" height="13" rx="1"/><path d="M7 7V4h10v3M7 11h4v4H7zM13 11h4v4h-4z"/>'),
  pack:  I('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  check: I('<path d="M4.5 12.5l5 5 10-11"/>', '0 0 24 24'),
  arrow: I('<path d="M4 12h15M13 6l6 6-6 6"/>'),
  cal:   I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  card:  I('<rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h4"/>'),
  shield:I('<path d="M12 3l7.5 3v5.5c0 4.6-3.2 7.9-7.5 9.5-4.3-1.6-7.5-4.9-7.5-9.5V6L12 3z"/><path d="M9 12l2.2 2.2L15.5 10"/>'),
  user:  I('<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/>'),
  pin:   I('<path d="M12 21s-6.5-5.4-6.5-10.5A6.5 6.5 0 0 1 12 4a6.5 6.5 0 0 1 6.5 6.5C18.5 15.6 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.3"/>'),
  cash:  I('<rect x="2.5" y="6.5" width="19" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5h.01M18 14.5h.01"/>'),
  gear:  I('<circle cx="12" cy="12" r="3"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/>'),
  lift:  I('<path d="M6.5 6.5v11M17.5 6.5v11M4 9.5h16"/>'),
  key:   I('<circle cx="8" cy="14" r="4"/><path d="M11 11l8-8M16 4l3 3M13 7l3 3"/>')
};

/* ==========================================================================
   FX — motion.dev skill mechanics, implemented dependency-free
   (SplitTextCascadeReveal · GlidingIndicator · MagneticPointerPull ·
    PointerTiltSurface · PathDrawReveal/DrawThenFill · ChasingSegmentLoop ·
    StreamingNumberCounter · CalmStateChoreography)
   ========================================================================== */
const CALM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (CALM) document.documentElement.classList.add('calm');
const FINE = window.matchMedia && window.matchMedia('(pointer: fine)').matches;

const fx = {
  /* SplitTextCascadeReveal: word-level, fade + short rise, one staggered delay */
  cascade(scope){
    const els = scope.querySelectorAll('.cascade');
    els.forEach(el => {
      if (el.dataset.split) return;
      el.dataset.split = "1";
      const words = el.textContent.trim().split(/\s+/);
      el.setAttribute('aria-label', el.textContent.trim());
      el.innerHTML = words.map((w,i) =>
        `<span class="w" style="transition-delay:${CALM?0:(i*34)}ms" aria-hidden="true">${w}</span>`
      ).join(' ');
      requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
    });
  },

  /* GlidingIndicator: marker glides via spring-eased scaleX, never teleports */
  progress(frac, label){
    const fill = document.getElementById('pfill');
    requestAnimationFrame(()=>{ fill.style.transform = `scaleX(${Math.max(0,Math.min(1,frac))})`; });
    const sc = document.getElementById('stepcount');
    if (sc) sc.textContent = label || '';
  },

  /* MagneticPointerPull: lean toward pointer at a fraction of offset, spring home */
  magnetic(el, strength = 0.28, radius = 90){
    if (CALM || !FINE || el.dataset.mag) return;
    el.dataset.mag = "1";
    let tx=0, ty=0, cx=0, cy=0, raf=null, hovering=false;
    const loop = () => {
      cx += (tx-cx)*0.18; cy += (ty-cy)*0.18;           // spring lag, not 1:1
      el.style.transform = `translate(${cx.toFixed(2)}px,${cy.toFixed(2)}px)`;
      if (hovering || Math.abs(cx-tx)>0.1 || Math.abs(cy-ty)>0.1) raf=requestAnimationFrame(loop);
      else { el.style.transform=''; raf=null; }
    };
    const kick = () => { if(!raf) raf=requestAnimationFrame(loop); };
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2);
      if (Math.hypot(dx,dy) > radius + Math.max(r.width,r.height)/2){ tx=ty=0; hovering=false; kick(); return; }
      hovering=true; tx=dx*strength; ty=dy*strength; kick();
    });
    el.addEventListener('pointerleave', ()=>{ hovering=false; tx=ty=0; kick(); });
  },

  /* PointerTiltSurface: per-element perspective, clamped tilt, specular highlight */
  tilt(el, maxDeg = 9){
    if (CALM || !FINE || el.dataset.tilt) return;
    el.dataset.tilt = "1";
    let rx=0, ry=0, trx=0, try_=0, raf=null;
    const loop = () => {
      rx += (trx-rx)*0.14; ry += (try_-ry)*0.14;
      el.style.setProperty('--rx', rx.toFixed(2)+'deg');
      el.style.setProperty('--ry', ry.toFixed(2)+'deg');
      if (Math.abs(rx-trx)>0.05 || Math.abs(ry-try_)>0.05) raf=requestAnimationFrame(loop);
      else { el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg'); raf=null; }
    };
    const kick=()=>{ if(!raf) raf=requestAnimationFrame(loop); };
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const nx = (e.clientX-r.left)/r.width - 0.5, ny = (e.clientY-r.top)/r.height - 0.5;
      try_ = Math.max(-1,Math.min(1,nx*2))*maxDeg;      // door-swing axis
      trx  = Math.max(-1,Math.min(1,ny*2))*-maxDeg;     // laptop-lid axis
      el.style.setProperty('--mx', ((nx+0.5)*100)+'%');
      el.style.setProperty('--my', ((ny+0.5)*100)+'%');
      kick();
    });
    el.addEventListener('pointerleave', ()=>{ trx=try_=0; kick(); });
  },

  /* StreamingNumberCounter: rAF interpolation, exact landing, tabular numerals */
  countUp(el, target, {dur=1100, fmt=(v)=>'$'+Math.round(v).toLocaleString('en-US')}={}){
    if (CALM){ el.textContent = fmt(target); return; }
    const t0 = performance.now();
    const step = (t) => {
      const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(2,-10*p); // easeOutExpo
      el.textContent = fmt(target*(p===1?1:e));
      if (p<1) requestAnimationFrame(step); else el.textContent = fmt(target); // pin exact
    };
    requestAnimationFrame(step);
  }
};

/* ==========================================================================
   STATE + ROUTER — one screen at a time, answers drive the next screen
   ========================================================================== */
const S = { branch:null, answers:{}, history:[], current:null };

const FLOW = {
  customer: ['c-what','c-size','c-pickup','c-dropoff','c-when','c-stairs','c-packing','c-heavy','c-estimate','c-lock','c-contact','c-pay','c-done'],
  mover:    ['m-name','m-phone','m-vehicle','m-lift','m-gear','m-area','m-avail','m-license','m-payout','m-review','m-done']
};
const LITE_TAIL = ['c-done-lite']; // quote-only path skips contact + payment

function flowFor(id){
  if (id==='c-done-lite') return [...FLOW.customer.slice(0,10), 'c-done-lite'];
  if (id.startsWith('c-')) return FLOW.customer;
  if (id.startsWith('m-')) return FLOW.mover;
  return [];
}
function nextId(id){
  const flow = S.branch==='customer'
    ? (S.answers.lock==='no' ? [...FLOW.customer.slice(0,10),'c-done-lite'] : FLOW.customer)
    : FLOW.mover;
  const i = flow.indexOf(id);
  return i>=0 && i<flow.length-1 ? flow[i+1] : null;
}
function prevId(id){
  const flow = S.branch==='customer'
    ? (S.answers.lock==='no' ? [...FLOW.customer.slice(0,10),'c-done-lite'] : FLOW.customer)
    : FLOW.mover;
  const i = flow.indexOf(id);
  return i>0 ? flow[i-1] : null;
}

const stage = document.getElementById('stage');
const chrome = document.getElementById('chrome');
const backBtn = document.getElementById('back');

function show(id, dir){
  dir = dir || 'fwd';
  const def = SCREENS[id];
  if (!def) return;
  const prev = stage.querySelector('.screen.active');
  const wrap = document.createElement('section');
  wrap.className = 'screen' + (dir==='back' ? ' from-left' : '') + (def.compact ? ' compact' : '');
  wrap.setAttribute('role','region');
  wrap.setAttribute('aria-label', def.title || id);
  wrap.innerHTML = `<div class="screen-inner">${def.html()}</div>`;
  stage.appendChild(wrap);
  if (def.mount) def.mount(wrap);

  // chrome visibility + progress (GlidingIndicator)
  const flow = flowFor(id);
  const inFlow = flow.includes(id);
  chrome.classList.toggle('on', inFlow);
  chrome.setAttribute('aria-hidden', inFlow ? 'false' : 'true');
  let backTarget = null;
  if (inFlow && !def.terminal){ const _i = flow.indexOf(id); backTarget = _i>0 ? flow[_i-1] : 'choice'; }
  backBtn.classList.toggle('show', !!backTarget);
  backBtn.onclick = backTarget ? ()=>go(backTarget,'back') : null;
  if (inFlow){
    const idx = flow.indexOf(id);
    fx.progress((idx+1)/flow.length, `${idx+1} / ${flow.length}`);
  }

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if (prev) prev.classList.remove('active');
    wrap.classList.add('active');
    fx.cascade(wrap);
    const h = wrap.querySelector('h1');
    if (h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
    setTimeout(()=>{ if(prev) prev.remove(); }, 650);
  }));
  S.current = id;
}
function go(id, dir){
  if (S.current && dir!=='back') S.history.push(S.current);
  show(id, dir);
}
function goNext(fromId){
  const n = nextId(fromId);
  if (n) go(n,'fwd');
}
function goBack(){
  const flow = S.current ? flowFor(S.current) : [];
  const i = flow.indexOf(S.current);
  const t = i>0 ? flow[i-1] : (i===0 ? 'choice' : null);
  if (t) go(t,'back');
}

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s||'').replace(/\D/g,'');
function fieldError(input, msg){
  input.classList.add('bad','shake');
  const hint = input.closest('.field').querySelector('.hint');
  if (hint){ hint.textContent = msg; hint.classList.remove('info'); }
  setTimeout(()=>input.classList.remove('shake'), 450);
  input.addEventListener('input', ()=>{ input.classList.remove('bad'); if(hint){hint.textContent='';} }, {once:true});
}
function cascadeHead(eyebrow, title, lede){
  return `${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1 class="cascade">${esc(title)}</h1>${lede?`<p class="lede">${lede}</p>`:''}`;
}
function primaryBtn(id, label, icon){
  return `<div class="cta-row"><button class="btn btn-primary magnetic" id="${id}">${esc(label)} ${icon||ICONS.arrow}</button></div>`;
}

/* Generic builders — every question is one full page */
function buildChoice(def, wrap){

      return; // stay on screen: inline Continue validates the conditional input
    }

  }));

}
function yesnoHTML(def){
  return cascadeHead(def.eyebrow, def.title, def.lede) + `
    <div class="ynrow" role="group" aria-label="${esc(def.title)}">
      <button class="yn yes" data-value="yes">${def.yesLabel||'Yes'}</button>

        <div class="hint info">${def.inline.hint||''}</div>
      </div></div>`:''}
    ${def.inlineCta?primaryBtn(def.inlineCta, def.inlineCtaLabel||'Continue'):''}`;
}
function buildInput(def, wrap){
  const cta = wrap.querySelector('#'+def.ctaId);
  fx.magnetic(cta);
  const inputs = [...wrap.querySelectorAll('input,select')];
  const submit = () => {
    let ok = true;
    inputs.forEach(inp=>{
      const v = inp.value.trim();
      const rule = def.validate[inp.name];
      if (rule){
        const msg = rule(v);
        if (msg){ fieldError(inp, msg); ok=false; }
      }
      S.answers[inp.name] = v;
    });
    if (ok) goNext(def.id);
  };
  cta.addEventListener('click', submit);
  inputs.forEach((inp,i)=>inp.addEventListener('keydown', e=>{
    if (e.key==='Enter'){ e.preventDefault(); (inputs[i+1]||cta).focus(); if(!inputs[i+1]) submit(); }
  }));
  setTimeout(()=>{ const f=inputs[0]; if(f && !CALM) f.focus({preventScroll:true}); }, 550);
}
function inputHTML(def){
  return cascadeHead(def.eyebrow, def.title, def.lede) + `
    ${def.fields.map(f=>`
      <div class="field">
        <label for="f-${f.name}">${f.label}</label>
        <input id="f-${f.name}" name="${f.name}" type="${f.type||'text'}"
          ${f.inputmode?`inputmode="${f.inputmode}"`:''} ${f.pattern?`pattern="${f.pattern}"`:''}
          ${f.maxlength?`maxlength="${f.maxlength}"`:''} placeholder="${esc(f.placeholder||'')}"
          autocomplete="${f.autocomplete||'off'}" ${f.attrs||''}>
      </div>`).join('')}
    <div class="hint info">${def.under||''}</div>
    ${primaryBtn(def.ctaId, def.ctaLabel||'Continue')}`;
}

/* ============================ DATA LAYER (Supabase) ============================
   Static hosting + Supabase is the standard pattern: the page POSTs new rows
   with the publishable key; Row Level Security lets visitors INSERT only.
   Reads happen in the Supabase dashboard (Table Editor) — never from this page. */
function sizeLabel(){
  const labels = {
    items:['1–3 items','4–8 items','9+ items'],
    office:['Small office','Medium office','Large office'],
    house:['Studio','1 bedroom','2 bedroom','3 bedroom','4+ bedroom'],
    apartment:['Studio','1 bedroom','2 bedroom','3 bedroom','4+ bedroom']
  };
  const what = S.answers.what || 'apartment';
  return ((labels[what] || [])[S.answers.sizeIdx || 0]) || '';
}
const db = {
  async insert(table, row){
    if (!CONFIG.supabase.enabled || typeof fetch === 'undefined') return {ok:false, offline:true};
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 8000);
    try{
      const res = await fetch(`${CONFIG.supabase.url}/rest/v1/${table}`, {
        method: 'POST',
        headers: {
          'apikey': CONFIG.supabase.anonKey,
          'Authorization': 'Bearer ' + CONFIG.supabase.anonKey,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(row),
        signal: ctrl.signal
      });
      clearTimeout(t);
      if (!res.ok) console.warn('[db] insert failed:', res.status);
      return {ok: res.ok, status: res.status};
    }catch(err){ clearTimeout(t); console.warn('[db] insert error:', err); return {ok:false}; }
  },
  booking(status){
    const a = S.answers;
    return this.insert('bookings', {
      booking_ref: a.bookingRef || null,
      name: a.name || null, phone: a.phone || null,
      pickup_zip: a.pickup || null, dropoff_zip: a.dropoff || null,
      move_type: a.what || null, size_label: sizeLabel() || null,
      move_when: a.when || null, move_date: a.moveDate || null,
      stairs: a.stairs === 'yes', packing: a.packing === 'yes',
      heavy: a.heavy === 'yes', heavy_what: a.heavyWhat || null,
      estimate_cents: (a.estimate || 0) * 100,
      last4: a.last4 || null, status: status || 'new'
    });
  },
  mover(){
    const a = S.answers;
    return this.insert('mover_applications', {
      name: a.moverName || null, phone: a.moverPhone || null,
      vehicle: a.vehicle === 'yes', vehicle_type: a.vehicleType || null,
      lift: a.lift === 'yes', gear: a.gear === 'yes',
      coverage_zip: a.moverZip || null, availability: a.avail || null,
      license: a.license === 'yes',
      payout_method: a.payout || null, payout_handle: a.payoutHandle || null,
      status: 'pending'
    });
  }
};

/* ---------- estimate (StreamingNumberCounter) ---------- */
function calcEstimate(a){
  const tables = {
    items:[45,75,110], office:[120,190,280], house:[60,100,150,210,280], apartment:[60,100,150,210,280]
  };
  const sizeLabels = {
    items:['1–3 items','4–8 items','9+ items'],
    office:['Small office','Medium office','Large office'],
    house:['Studio','1 bedroom','2 bedroom','3 bedroom','4+ bedroom'],
    apartment:['Studio','1 bedroom','2 bedroom','3 bedroom','4+ bedroom']
  };
  const what = a.what||'apartment', idx = a.sizeIdx||0;
  const base = 95, size = (tables[what]||tables.apartment)[Math.min(idx,(tables[what]||[]).length-1)]||0;
  const miles = 3 + ((parseInt(a.pickup||'0',10)*7 + parseInt(a.dropoff||'0',10)*13) % 28);
  const dist = 25 + Math.round(miles*1.6);
  const lines = [
    ['Base crew (2 movers)', base],
    [`Size — ${(sizeLabels[what]||[])[idx]||''}`, size],
    [`Distance (~${miles} mi)`, dist],
  ];
  if (a.stairs==='yes') lines.push(['Stairs carry', 35]);
  if (a.packing==='yes') lines.push(['Full packing service', 60]);
  if (a.heavy==='yes') lines.push([`Heavy item${a.heavyWhat?` — ${a.heavyWhat}`:''}`, 85]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { lines, total: Math.round(total/5)*5 };
}

SCREENS['m-done'] = {
  terminal:true,
  html: () => {
    const a = S.answers;
    const first = (a.moverName||'').trim().split(/\s+/)[0] || 'there';
    const zip = a.moverZip || '33101';
    const jobs = [
      {t:'2BR apartment move', s:`${zip} → nearby · Sat 9:00 AM · 2 movers`, pay:'$180'},
      {t:'Office desks (4 pcs)', s:`Downtown ${zip} · Sun 1:00 PM · gear needed`, pay:'$140'},
    ];
    return `<div class="done-wrap">
      <div id="doneMark"><svg viewBox="0 0 100 100" fill="none" style="width:100%;height:100%">
        <circle data-draw cx="50" cy="50" r="45" pathLength="1" stroke="#FF4D00" stroke-width="5"/>
        <path data-draw d="M32 51l13 13 24-27" pathLength="1" stroke="#141412" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg></div>
      ${cascadeHead('','You’re on the roster, '+esc(first)+'.','We’ll text <b>'+esc(a.moverPhone||'you')+'</b> when jobs drop near <b>'+esc(zip)+'</b>.')}
    </div>
    <div class="eyebrow" style="margin-top:6px">Open jobs near you</div>
    ${jobs.map((j,i)=>`
      <button class="job" data-job="${i}">
        <span class="j-ic">${ICONS.truck}</span>
        <span><b>${esc(j.t)}</b><small>${esc(j.s)}</small></span>
        <span class="j-pay"><b>${j.pay}</b><br><span class="j-claim">TAP TO CLAIM</span></span>
      </button>`).join('')}
    <div class="cta-row"><button class="btn btn-ghost" id="cta-restart3">Start over</button></div>`;
  },
  mount(w){
    requestAnimationFrame(()=>w.querySelector('#doneMark').classList.add('drawn'));
    w.querySelectorAll('.job').forEach(j=>j.addEventListener('click', ()=>{
      j.classList.add('claimed');
      j.querySelector('.j-claim').textContent = 'CLAIMED ✓ — DETAILS BY TEXT';
    }, {once:true}));
    w.querySelector('#cta-restart3').addEventListener('click', ()=>{ S.branch=null; S.answers={}; S.history=[]; show('choice','back'); });
  }
};

show('loader','fwd');
